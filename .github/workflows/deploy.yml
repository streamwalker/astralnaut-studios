name: Deploy to Cloudflare Workers

# Pushes to main deploy. Pull requests build and typecheck only — no deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys race each other onto the same Worker.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` requires package-lock.json to be consistent with package.json.
      # If this step fails, the lockfile is stale — run `npm install` locally
      # and commit the result. Do not switch this to `npm install`.
      - name: Install dependencies
        run: npm ci

      # The VITE_* values the client bundle needs are committed in .env,
      # .env.development and .env.production. They are publishable keys, not
      # secrets — see .env.example for the distinction.
      - name: Build
        run: npm run build

      # Advisory only. The repo carries 33 pre-existing TanStack Router
      # `search` prop errors; failing the deploy on them would block every
      # push. Remove `continue-on-error` once that debt is cleared.
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Verify deploy bundle
        run: npm run deploy:dry

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: .output
          retention-days: 5

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Requires two repository secrets:
      #   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" template
      #   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
      #
      # Runtime secrets (STRIPE_LIVE_API_KEY, SUPABASE_SERVICE_ROLE_KEY,
      # RESEND_API_KEY, the webhook secrets, ARCHIVE_GAME_EVENTS_HMAC_SECRET)
      # are NOT set here. They live on the Worker itself via
      # `wrangler secret put` and persist across deploys. See .env.example.
      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
